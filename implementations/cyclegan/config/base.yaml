# CycleGAN 基础配置文件
# 包含训练和测试共享的参数

# ========== 训练参数 ==========
dataset_name: "apple2orange"      # 数据集名称

# ========== 图像参数 ==========
img_height: 256                   # 输入图像高度
img_width: 256                    # 输入图像宽度
channels: 3                       # 输入图像通道数
input_nc: 3                       # 输入图像通道数
output_nc: 3                      # 输出图像通道数
size: 256                         # 输入图像大小

# ========== 模型架构 ==========
n_residual_blocks: 9              # 残差块数量

# ========== 数据加载 ==========
n_cpu: 8                         # 线程数
batch_size: 1                    # 批量大小

# ========== GPU 设置 ==========
cuda: true                       # 是否使用GPU
