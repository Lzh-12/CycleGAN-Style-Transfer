# CycleGAN 训练配置
# 基于 base.yaml，添加训练特有参数

# 继承基础配置（需要在代码中处理）
_base_: "base.yaml"


# ======================
# 通用训练配置
# ======================
epoch: 0                     # 从第几个 epoch 开始训练（0 表示从头开始）
n_epochs: 201                # 总训练 epoch 数

# ======================
# 优化器与学习率
# ======================
lr: 0.0002                   # Adam 学习率
b1: 0.5                      # Adam beta1
b2: 0.999                    # Adam beta2
decay_epoch: 100             # 从该 epoch 开始线性衰减学习率

# ======================
# 损失权重
# ======================
lambda_cyc: 10.0             # 循环一致性损失权重
lambda_id: 5.0               # 身份映射损失权重

# ======================
# 日志与保存
# ======================
sample_interval: 100         # 每隔多少 batch 保存一次生成样本
checkpoint_interval: 20      # 每隔多少 epoch 保存一次模型（-1 表示不保存）

# ======================
# 路径（可选，也可硬编码）
# ======================
data_root: "./data"
image_save_dir: "output"
model_save_dir: "checkpoints"